name: Sync league results

on:
  schedule:
    # Run hourly so Central daylight/standard time are both covered. A private
    # gate below continues only at midnight, 2 AM, 4 AM, and so on Thursday.
    - cron: "0 * * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: league-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check the private Central-time window
        id: window
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=America/Chicago date +%H)
          if (( 10#$hour % 2 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.window.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.window.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.window.outputs.run == 'true'
      - name: Check LeagueSecretary for verified updates
        if: steps.window.outputs.run == 'true'
        run: node scripts/sync-leaguesecretary.mjs
      - name: Publish changed league data
        if: steps.window.outputs.run == 'true'
        run: |
          if git diff --quiet -- public/data/leagues; then
            echo "No new league data to publish."
            exit 0
          fi
          git config user.name "West Lanes League Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -- public/data/leagues
          git commit -m "Update West Lanes league results"
          git push
