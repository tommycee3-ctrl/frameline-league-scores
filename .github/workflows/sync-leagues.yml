name: Sync league results

on:
  schedule:
    # GitHub warns that jobs at the start of an hour can be delayed or dropped.
    # Run at :17 with a :37 fallback. Freshness, rather than the wall clock,
    # decides whether delayed jobs need to refresh the data.
    - cron: "17 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-leagues.yml"
      - "scripts/sync-leaguesecretary.mjs"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: league-score-refresh
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Enable scheduled or manual sync
        id: window
        shell: bash
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "mode=--known-only" >> "$GITHUB_OUTPUT"
          echo "Checking whether the last completed refresh is stale."
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
        with:
          ref: main
      - name: Run only when league data is due
        id: fallback
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            exit 0
          fi
          latest=$(jq -r '[.[] | select(.mode == "known leagues")][0].finishedAt // empty' .github/refresh-history.json 2>/dev/null || true)
          if [[ -z "$latest" ]]; then
            echo "No completed refresh is logged; running now."
            exit 0
          fi

          latest_epoch=$(date -d "$latest" +%s)
          now_epoch=$(date +%s)
          age_minutes=$(( (now_epoch - latest_epoch) / 60 ))
          echo "Last completed refresh was $age_minutes minutes ago."
          if (( age_minutes < 105 )); then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "League data is still fresh; skipping this duplicate trigger."
          else
            echo "League data is stale; running the refresh even if GitHub delivered this job late."
          fi
      - uses: actions/setup-node@v4
        if: steps.window.outputs.run == 'true' && steps.fallback.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.window.outputs.run == 'true' && steps.fallback.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.window.outputs.run == 'true' && steps.fallback.outputs.run == 'true'
      - name: Check changed leagues and publish updates
        id: publish
        if: steps.window.outputs.run == 'true' && steps.fallback.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "FrameLine League Sync"
          git config user.email "actions@users.noreply.github.com"

          git pull --rebase origin main
          node scripts/sync-leaguesecretary.mjs ${{ steps.window.outputs.mode }} | tee sync-report.log
          {
            echo "## FrameLine refresh report"
            echo '```'
            grep -E '^SYNC (SUMMARY|CHANGE)' sync-report.log || echo "No refresh summary was produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if git diff --quiet -- public/data/leagues; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          git add -- public/data/leagues .github/refresh-history.json
          if git diff --cached --quiet; then
            echo "All known leagues are current."
            exit 0
          fi
          git commit -m "Record FrameLine league refresh"
          git push

  deploy:
    if: needs.sync.outputs.changed == 'true'
    needs: sync
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the refreshed app
        env:
          NEXT_PUBLIC_BASE_PATH: /frameline-league-scores
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Publish refreshed league data
        id: deployment
        uses: actions/deploy-pages@v4
