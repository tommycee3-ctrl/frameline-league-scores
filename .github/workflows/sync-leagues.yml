name: Sync league results

on:
  schedule:
    # Backend-only refresh every two hours, offset from the start of the hour.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: frameline-league-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      partial_failure: ${{ steps.publish.outputs.partial_failure }}
    steps:
      - name: Enable scheduled or manual sync
        id: window
        shell: bash
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "mode=--known-only --current-only --import-concurrency=4 --max-import-minutes=95" >> "$GITHUB_OUTPUT"
          echo "Checking whether the last completed refresh is stale."
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
        with:
          ref: main
      - name: Run only when league data is due
        id: fallback
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            exit 0
          fi
          latest=$(jq -r '[.[] | select((.mode == "known leagues" or .mode == "league discovery") and ((.scope // "all") == "all"))][0].finishedAt // empty' .github/refresh-history.json 2>/dev/null || true)
          if [[ -z "$latest" ]]; then
            echo "No completed refresh is logged; running now."
            exit 0
          fi

          latest_epoch=$(date -d "$latest" +%s)
          now_epoch=$(date +%s)
          age_minutes=$(( (now_epoch - latest_epoch) / 60 ))
          echo "Last completed refresh was $age_minutes minutes ago."
          pending=$(jq -r '[.[] | select((.mode == "known leagues" or .mode == "league discovery") and ((.scope // "all") == "all"))][0].deferredLeagues | length' .github/refresh-history.json 2>/dev/null || echo 0)
          if (( age_minutes < 105 && pending == 0 )); then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "League data is still fresh; skipping this duplicate trigger."
          else
            echo "League data is stale; running the refresh even if GitHub delivered this job late."
          fi
      - uses: actions/setup-node@v4
        if: steps.window.outputs.run == 'true' && steps.fallback.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.window.outputs.run == 'true' && steps.fallback.outputs.run == 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pdfplumber==0.11.7
      - run: node --test tests/official-recap.test.mjs
      - run: npx playwright install --with-deps chromium
        if: steps.window.outputs.run == 'true' && steps.fallback.outputs.run == 'true'
      - name: Check changed leagues and publish updates
        id: publish
        if: steps.window.outputs.run == 'true' && steps.fallback.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          git config user.name "FrameLine League Sync"
          git config user.email "actions@users.noreply.github.com"

          git pull --rebase origin main
          set +e
          node scripts/sync-leaguesecretary.mjs ${{ steps.window.outputs.mode }} 2>&1 | tee sync-report.log
          source_status=${PIPESTATUS[0]}
          set -e
          if (( source_status != 0 )); then
            if grep -q 'blocking live report reads (HTTP 403)' sync-report.log; then
              echo 'Live report API blocked; checking published official recap PDFs.' | tee -a sync-report.log
              echo 'partial_failure=true' >> "$GITHUB_OUTPUT"
            else
              exit "$source_status"
            fi
          fi
          node scripts/sync-static-recaps.mjs 2>&1 | tee -a sync-report.log
          node scripts/sync-static-standings.mjs 2>&1 | tee -a sync-report.log
          node scripts/sync-leaguepals.mjs | tee -a sync-report.log
          {
            echo "## FrameLine refresh report"
            echo '```'
            grep -E '^(SYNC|LEAGUEPALS) (SUMMARY|CHANGE)|^Official (recap|standings) pass:' sync-report.log || echo "No refresh summary was produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q '^SYNC FAILURE' sync-report.log; then
            echo "partial_failure=true" >> "$GITHUB_OUTPUT"
            echo '### Import warnings' >> "$GITHUB_STEP_SUMMARY"
            grep '^SYNC FAILURE' sync-report.log >> "$GITHUB_STEP_SUMMARY"
          fi
          node scripts/reconcile-refresh.mjs
          if git diff --quiet -- public/data/leagues; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          git add -- public/data/leagues .github/refresh-history.json
          if git diff --cached --quiet; then
            echo "All known leagues are current."
            exit 0
          fi
          git commit -m "Record FrameLine league refresh"
          git push
          if grep -q '^SYNC FAILURE' sync-report.log; then
            echo "partial_failure=true" >> "$GITHUB_OUTPUT"
            echo "Verified updates published; some leagues retain prior data."
            echo '### Import warnings' >> "$GITHUB_STEP_SUMMARY"
            grep '^SYNC FAILURE' sync-report.log >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    if: needs.sync.outputs.changed == 'true'
    needs: sync
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the refreshed app
        env:
          NEXT_PUBLIC_BASE_PATH: /frameline-league-scores
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Publish refreshed league data
        id: deployment
        uses: actions/deploy-pages@v4
