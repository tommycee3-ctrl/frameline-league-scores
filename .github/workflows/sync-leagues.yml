name: Sync league results

on:
  schedule:
    # GitHub schedules in UTC. Run hourly and use the Central-time gate below
    # so the refresh stays on 10 PM, midnight, 2 AM, etc. across DST changes.
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-leagues.yml"

permissions:
  contents: write

concurrency:
  group: league-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Enable scheduled or manual sync
        id: window
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=--known-only" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          central_hour=$(TZ=America/Chicago date +%H)
          if (( 10#$central_hour % 2 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            if [[ "$central_hour" == "00" ]]; then
              echo "mode=" >> "$GITHUB_OUTPUT"
              echo "Running the daily new-league discovery scan."
            else
              echo "mode=--known-only" >> "$GITHUB_OUTPUT"
              echo "Checking known leagues for changed source dates."
            fi
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping odd Central-time hour $central_hour."
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.window.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.window.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.window.outputs.run == 'true'
      - name: Check changed leagues and publish updates
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "FrameLine League Sync"
          git config user.email "actions@users.noreply.github.com"

          git pull --rebase origin main
          node scripts/sync-leaguesecretary.mjs ${{ steps.window.outputs.mode }}

          if git diff --quiet -- public/data/leagues; then
            echo "All known leagues are current."
            exit 0
          fi

          git add -- public/data/leagues
          git commit -m "Update changed FrameLine league results"
          git push
