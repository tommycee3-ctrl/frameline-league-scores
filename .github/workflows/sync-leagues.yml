name: Sync league results

on:
  schedule:
    # Run hourly so Central daylight/standard time are both covered. The gate
    # checks every active league on each even Central-time hour and publishes
    # only when LeagueSecretary has actually changed.
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: league-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Enable scheduled or manual sync
        id: window
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.window.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.window.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.window.outputs.run == 'true'
      - name: Check LeagueSecretary for verified updates
        if: steps.window.outputs.run == 'true'
        run: node scripts/sync-leaguesecretary.mjs
      - name: Publish changed league data
        id: publish
        if: steps.window.outputs.run == 'true'
        run: |
          if git diff --quiet -- public/data/leagues; then
            echo "No new league data to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "West Lanes League Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -- public/data/leagues
          git commit -m "Update West Lanes league results"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.publish.outputs.changed == 'true'
        with:
          enablement: true
      - name: Build the updated public site
        if: steps.publish.outputs.changed == 'true'
        run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /west-lanes-bowling
      - uses: actions/upload-pages-artifact@v3
        if: steps.publish.outputs.changed == 'true'
        with:
          path: ./out

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy updated league results
        id: deployment
        uses: actions/deploy-pages@v4
