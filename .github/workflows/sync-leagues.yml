name: Sync league results

on:
  schedule:
    # Both Central daylight and standard-time windows; the script keeps only
    # midnight, 6 AM, noon, and 6 PM in America/Chicago.
    - cron: "0 5,6,11,12,17,18,23 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: league-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check LeagueSecretary for verified updates
        run: node scripts/sync-leaguesecretary.mjs
      - name: Publish changed league data
        run: |
          if git diff --quiet -- public/data/leagues; then
            echo "No new league data to publish."
            exit 0
          fi
          git config user.name "West Lanes League Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -- public/data/leagues
          git commit -m "Update West Lanes league results"
          git push
