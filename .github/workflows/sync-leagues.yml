name: Sync league results

on:
  schedule:
    # Run hourly so Central daylight/standard time are both covered. The gate
    # checks every active league on each even Central-time hour and publishes
    # only when LeagueSecretary has actually changed.
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-leagues.yml"

permissions:
  contents: write

concurrency:
  group: league-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Enable scheduled or manual sync
        id: window
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.window.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.window.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.window.outputs.run == 'true'
      - name: Import and publish each bowling center
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "FrameLine League Sync"
          git config user.email "actions@users.noreply.github.com"

          for center in 2110 2119 5144 2208; do
            echo "Importing bowling center $center..."
            node scripts/sync-leaguesecretary.mjs "--center=$center"

            if git diff --quiet -- public/data/leagues; then
              echo "Bowling center $center had no new data to publish."
              continue
            fi

            git add -- public/data/leagues
            git commit -m "Update FrameLine center $center league results"

            # Replay the center's data commit on top of any website edits that
            # landed while the importer was running, then retry if necessary.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                echo "Published bowling center $center."
                break
              fi
              if [[ "$attempt" == "3" ]]; then
                echo "Unable to publish bowling center $center after three attempts."
                exit 1
              fi
              sleep 5
            done
          done
