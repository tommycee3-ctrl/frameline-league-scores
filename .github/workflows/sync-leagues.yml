name: Sync league results

on:
  schedule:
    # Try at the top of the hour, then retry at :10 if GitHub dropped or did not
    # complete the primary schedule. The Central-time gate keeps even hours.
    - cron: "0 * * * *"
    - cron: "10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-leagues.yml"
      - "scripts/sync-leaguesecretary.mjs"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: league-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Enable scheduled or manual sync
        id: window
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=--known-only" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          central_hour=$(TZ=America/Chicago date +%H)
          if (( 10#$central_hour % 2 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            if [[ "$central_hour" == "00" ]]; then
              echo "mode=" >> "$GITHUB_OUTPUT"
              echo "Running the daily new-league discovery scan."
            else
              echo "mode=--known-only" >> "$GITHUB_OUTPUT"
              echo "Checking known leagues for changed source dates."
            fi
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping odd Central-time hour $central_hour."
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
        with:
          ref: main
      - name: Skip an unnecessary fallback
        id: fallback
        if: steps.window.outputs.run == 'true'
        shell: bash
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "schedule" || "$TRIGGER_SCHEDULE" != "10 * * * *" ]]; then
            exit 0
          fi
          latest=$(jq -r '.[0].finishedAt // empty' .github/refresh-history.json 2>/dev/null || true)
          if [[ -z "$latest" ]]; then
            echo "No completed refresh is logged for this cycle; running fallback."
            exit 0
          fi
          current_cycle=$(TZ=America/Chicago date +%Y-%m-%dT%H)
          latest_cycle=$(TZ=America/Chicago date -d "$latest" +%Y-%m-%dT%H)
          if [[ "$latest_cycle" == "$current_cycle" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The primary refresh already completed during $current_cycle Central; skipping fallback."
          else
            echo "No completed primary refresh was found for $current_cycle Central; running fallback."
          fi
      - uses: actions/setup-node@v4
        if: steps.window.outputs.run == 'true' && steps.fallback.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.window.outputs.run == 'true' && steps.fallback.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.window.outputs.run == 'true' && steps.fallback.outputs.run == 'true'
      - name: Check changed leagues and publish updates
        id: publish
        if: steps.window.outputs.run == 'true' && steps.fallback.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "FrameLine League Sync"
          git config user.email "actions@users.noreply.github.com"

          git pull --rebase origin main
          node scripts/sync-leaguesecretary.mjs ${{ steps.window.outputs.mode }} | tee sync-report.log
          {
            echo "## FrameLine refresh report"
            echo '```'
            grep -E '^SYNC (SUMMARY|CHANGE)' sync-report.log || echo "No refresh summary was produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if git diff --quiet -- public/data/leagues; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          git add -- public/data/leagues .github/refresh-history.json
          if git diff --cached --quiet; then
            echo "All known leagues are current."
            exit 0
          fi
          git commit -m "Record FrameLine league refresh"
          git push

  deploy:
    if: needs.sync.outputs.changed == 'true'
    needs: sync
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the refreshed app
        env:
          NEXT_PUBLIC_BASE_PATH: /frameline-league-scores
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Publish refreshed league data
        id: deployment
        uses: actions/deploy-pages@v4
