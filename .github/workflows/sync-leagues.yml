name: Sync league results

on:
  schedule:
    # Run hourly so Central daylight/standard time are both covered. The gate
    # checks every active league on each even Central-time hour and publishes
    # only when LeagueSecretary has actually changed.
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: league-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Enable scheduled or manual sync
        id: window
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.window.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.window.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.window.outputs.run == 'true'
      - name: Check LeagueSecretary for verified updates
        if: steps.window.outputs.run == 'true'
        run: node scripts/sync-leaguesecretary.mjs
      - name: Publish changed league data
        id: publish
        if: steps.window.outputs.run == 'true'
        run: |
          if git diff --quiet -- public/data/leagues; then
            echo "No new league data to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "FrameLine League Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -- public/data/leagues
          git commit -m "Update FrameLine league results"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
