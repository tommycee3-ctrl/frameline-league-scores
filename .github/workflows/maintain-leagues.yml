name: Maintain league catalog and history

on:
  schedule:
    # 05:43 UTC is midnight Central during daylight time; 06:43 UTC is
    # midnight during standard time. The local-time gate selects one run.
    - cron: "43 5,6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: frameline-league-maintenance
  cancel-in-progress: true

jobs:
  maintain:
    # Playwright 1.55 requires a supported Linux image; ubuntu-latest began
    # migrating to Ubuntu 26 in October 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Run only at midnight Central
        id: window
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$(TZ=America/Chicago date +%H)" == "00" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the daylight/standard-time duplicate."
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: steps.window.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.window.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: "3.12"
      - run: python -m pip install pdfplumber==0.11.7
        if: steps.window.outputs.run == 'true'
      - run: node --test tests/official-recap.test.mjs
        if: steps.window.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.window.outputs.run == 'true'
      - name: Discover leagues and backfill history
        id: publish
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "FrameLine League Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          node scripts/sync-leaguesecretary.mjs | tee maintenance-report.log
          node scripts/sync-static-lanes.mjs 2>&1 | tee -a maintenance-report.log
          node scripts/sync-leaguepals.mjs | tee -a maintenance-report.log
          {
            echo "## FrameLine maintenance report"
            echo '```'
            grep -E '^(SYNC|LEAGUEPALS) (SUMMARY|CHANGE)' maintenance-report.log || echo "No maintenance summary was produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- public/data/leagues; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git add -- public/data/leagues .github/refresh-history.json
          if git diff --cached --quiet; then
            echo "League catalog and histories are current."
            exit 0
          fi
          git commit -m "Maintain FrameLine league catalog and history"
          git pull --rebase origin main
          git push
