name: Check bowling source compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-compatibility
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pdfplumber==0.11.7
      - run: node --test tests/official-recap.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Check importer and cache regressions
        run: node --test tests/reconcile-refresh.test.mjs tests/import-queue.test.mjs tests/source-retry.test.mjs tests/source-contract.test.mjs tests/sync-layout.test.mjs tests/service-worker-data.test.mjs
      - name: Test current source reports without changing published data
        shell: bash
        run: |
          set -o pipefail
          set +e
          node scripts/sync-leaguesecretary.mjs --check-source 2>&1 | tee source-check.log
          source_status=${PIPESTATUS[0]}
          set -e
          if (( source_status != 0 )); then
            if grep -q 'blocking live report reads (HTTP 403)' source-check.log; then
              echo 'Live report API is blocked; official PDF fallback is checked by the two-hour sync.' | tee -a source-check.log
              exit 0
            fi
            exit "$source_status"
          fi
      - name: Save compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-compatibility-report
          path: source-check.log
      - name: Summarize source status
        if: always()
        shell: bash
        run: |
          echo '## Bowling source compatibility' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 source-check.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
